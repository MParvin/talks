<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talks — Mohammad Parvin</title>
  <meta name="description" content="ارائه‌های محمد پروین" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #22d3ee;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Vazirmatn", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
    }
    main { width: min(720px, 100%); }
    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin: 0 0 0.35rem;
    }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    a.talk {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    a.talk:hover {
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
    }
    a.talk h2 {
      margin: 0 0 0.4rem;
      font-size: 1.15rem;
      color: var(--accent);
    }
    a.talk p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Talks</h1>
    <p class="sub">ارائه‌های محمد پروین</p>

    <a class="talk" href="vibe-coding/">
      <h2>Open Source Tools for Vibe Coding</h2>
      <p>توسعهٔ هدایت‌شده با AI — ابزارهای متن‌باز بدون وابستگی به یک وندور</p>
    </a>

    <footer>
      <a href="https://mparvin.me">mparvin.me</a>
      ·
      <a href="https://github.com/MParvin">GitHub</a>
    </footer>
  </main>
</body>
</html>
